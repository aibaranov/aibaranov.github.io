<!-- _includes/tech_accordion_nav.html -->

<div class="technique-summary">
  <strong>Techniques selected:</strong> <span id="selected-list">None</span>
  <button id="copy-techniques" class="btn--copy" style="display:none; margin-left: 10px;" title="Copy to clipboard">
    <i class="far fa-copy"></i>
  </button>
  <!-- UPDATED: This button now clears selection AND folds menus -->
  <button id="reset-techniques" class="btn--reset" style="display:none; margin-left: 10px;">(Clear All)</button>
  
  <span style="margin-left: 15px; border-left: 1px solid #ccc; padding-left: 15px;">
    <a href="#" id="toggle-all-menus" style="font-size: 0.8em; text-decoration: none; color: #7a7a7a;">Expand All</a>
  </span>
</div>

<!-- Vector Input Section -->
<div class="technique-vector-input" style="margin: 15px 0; padding: 10px; background: #f9f9f9; border: 1px solid #eee; border-radius: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
  <label for="vector-input" style="font-weight: bold; margin: 0;">Input techniques vector:</label>
  <input type="text" id="vector-input" placeholder="e.g. T1.a, T2.b" style="padding: 5px; width: 250px; border: 1px solid #ccc; border-radius: 3px;">
  <button id="show-vector-btn" class="btn" style="padding: 5px 15px; cursor: pointer; background-color: #222; color: #fff; border: none; border-radius: 3px;">Show</button>
  <button id="reset-vector-btn" class="btn" style="padding: 5px 15px; cursor: pointer; background-color: #ddd; color: #333; border: none; border-radius: 3px;">Reset</button>
</div>

<div id="tech-accordion-container" class="accordion-nav-container">
  {% for col in site.data.tech_accordion_menu %}
  <div class="accordion-column">
    
    <!-- Top Level Header -->
    <button class="accordion-header" onclick="toggleAccordion(this)">
      {{ col.title }}
      <span class="tooltip-text">{{ col.tooltip }}</span>
    </button>

    <!-- Dropdown List -->
    <div class="accordion-content">
      {% for item in col.items %}
      <div class="accordion-item technique-item" data-value="{{ item.label }}" data-prefix="{{ col.id }}"> 
        {{ item.label }}
        <span class="tooltip-text-side">{{ item.tooltip }}</span>
      </div>
      {% endfor %}
    </div>

  </div>
  {% endfor %}
</div>

<script>
function toggleAccordion(element) {
  element.nextElementSibling.classList.toggle('show');
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const container = document.getElementById('tech-accordion-container');
  if(!container) return;
  
  // --- CONFIGURATION ---
  const itemSelector = '.technique-item';
  const summaryOutput = document.getElementById('selected-list');
  const resetButton = document.getElementById('reset-techniques'); // Top "Clear All"
  const copyButton = document.getElementById('copy-techniques');
  const toggleAllBtn = document.getElementById('toggle-all-menus');
  
  const allContents = container.querySelectorAll('.accordion-content');
  const allHeaders = container.querySelectorAll('.accordion-header');
  const items = container.querySelectorAll(itemSelector);
  
  const vectorInput = document.getElementById('vector-input');
  const showVectorBtn = document.getElementById('show-vector-btn');
  const resetVectorBtn = document.getElementById('reset-vector-btn'); // Bottom "Reset"

  let allExpanded = false;

  items.forEach(item => {
    item.addEventListener('click', function(e) {
      this.classList.toggle('is-selected');
      updateSummaryDisplay();
    });
  });

  // --- UPDATED: "Clear All" BUTTON LOGIC ---
  resetButton.addEventListener('click', function() {
    // 1. Clear Selection
    items.forEach(el => el.classList.remove('is-selected'));
    
    // 2. Fold All Menus (Collapse)
    allContents.forEach(content => {
      content.classList.remove('show');
      content.style.maxHeight = null;
    });

    // 3. Reset Header Arrows
    allHeaders.forEach(header => {
      header.classList.remove('active');
    });

    // 4. Reset Global Toggle State
    allExpanded = false;
    toggleAllBtn.textContent = "Expand All";

    // 5. Update Text Summary
    updateSummaryDisplay();
  });

  // Copy button logic
  copyButton.addEventListener('click', function() {
    const textToCopy = summaryOutput.textContent;
    if (textToCopy && textToCopy !== "None") {
      navigator.clipboard.writeText(textToCopy).then(() => {
        this.classList.add('copied');
        const icon = this.querySelector('i');
        icon.className = 'fas fa-check'; 
        setTimeout(() => {
          this.classList.remove('copied');
          icon.className = 'far fa-copy'; 
        }, 2000);
      });
    }
  });

  // --- LOGIC: SHOW VECTOR ---
  showVectorBtn.addEventListener('click', function() {
    const rawInput = vectorInput.value;
    if (!rawInput) return;

    items.forEach(el => el.classList.remove('is-selected'));

    const tokens = rawInput.split(',').map(t => t.trim());

    tokens.forEach(token => {
      const parts = token.split('.');
      if (parts.length === 2) {
        const prefix = parts[0]; 
        const label = parts[1];

        const targetItem = document.querySelector(`.technique-item[data-prefix="${prefix}"][data-value="${label}"]`);

        if (targetItem) {
          targetItem.classList.add('is-selected');

          const parentContent = targetItem.closest('.accordion-content');
          const parentHeader = parentContent.previousElementSibling;

          if (parentContent) {
            parentContent.classList.add('show');
            parentContent.style.maxHeight = parentContent.scrollHeight + "px";
          }
          if (parentHeader) {
            parentHeader.classList.add('active');
          }
        }
      }
    });
    updateSummaryDisplay();
  });

  // --- LOGIC: BOTTOM RESET BUTTON ---
  // (Identical behavior to Clear All, also clears input field)
  resetVectorBtn.addEventListener('click', function() {
    vectorInput.value = "";
    resetButton.click(); // Trigger the logic we just wrote above
  });


  function updateSummaryDisplay() {
    const selectedItems = document.querySelectorAll(itemSelector + '.is-selected');
    
    const values = Array.from(selectedItems).map(el => {
      const prefix = el.getAttribute('data-prefix');
      const label = el.getAttribute('data-value').trim();
      return `${prefix}.${label}`; 
    });
    
    if (values.length > 0) {
      summaryOutput.textContent = values.join(', '); 
      resetButton.style.display = 'inline-block'; 
      copyButton.style.display = 'inline-block'; 
    } else {
      summaryOutput.textContent = "None";
      resetButton.style.display = 'none'; 
      copyButton.style.display = 'none'; 
    }
  }

  // --- LOGIC: INDEPENDENT FOLDING ---
  const headers = document.querySelectorAll('.accordion-header'); 

  headers.forEach(header => {
    header.addEventListener('click', function(e) {
      this.classList.toggle('active');
      const panel = this.nextElementSibling;
      if (panel.style.maxHeight) {
        panel.style.maxHeight = null; 
      } else {
        panel.style.maxHeight = panel.scrollHeight + "px"; 
      }
    });
  });
  
  toggleAllBtn.addEventListener('click', function(e) {
    e.preventDefault();
    allExpanded = !allExpanded;

    allContents.forEach(content => {
      if (allExpanded) {
        content.classList.add('show');
        content.style.maxHeight = content.scrollHeight + "px"; 
      } else {
        content.classList.remove('show');
        content.style.maxHeight = null;
      }
    });

    allHeaders.forEach(header => {
      if (allExpanded) header.classList.add('active');
      else header.classList.remove('active');
    });

    this.textContent = allExpanded ? "Collapse All" : "Expand All";
  });

});
</script>
