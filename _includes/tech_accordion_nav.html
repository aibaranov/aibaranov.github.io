<!-- _includes/tech_accordion_nav.html -->

<!-- 1. SUMMARY & CONTROLS (Refactored for Flexbox Layout) -->
<div class="technique-summary">
  <div class="summary-readout">
    <strong>Techniques selected:</strong> 
    <span id="selected-list">None</span>
  </div>
  
  <div class="summary-actions">
    <!-- Copy Button -->
    <button id="copy-techniques" class="btn--icon" style="display:none;" title="Copy to clipboard">
      <i class="far fa-copy"></i>
    </button>
    
    <!-- Clear Button -->
    <button id="reset-techniques" class="btn--text" style="display:none;">(Clear All)</button>
    
    <span class="divider"></span>
    
    <!-- Expand All -->
    <button id="toggle-all-menus" class="btn--link">Expand All</button>
  </div>
</div>

<!-- 2. VECTOR INPUT SECTION (Clean - No Inline Styles) -->
<div class="technique-vector-input">
  <label for="vector-input">Input techniques vector:</label>
  <input type="text" id="vector-input" placeholder="e.g. T1.a, T2.b">
  
  <!-- Action Buttons -->
  <button id="paste-vector-btn" class="btn">Paste</button>
  <button id="show-vector-btn" class="btn">Show</button>
  <button id="reset-vector-btn" class="btn">Reset</button>
</div>

<!-- 3. ACCORDION CONTAINER -->
<div id="tech-accordion-container" class="accordion-nav-container">
  {% for col in site.data.tech_accordion_menu %}
  <div class="accordion-column">
    
    <!-- Header (Removed inline onclick) -->
    <button class="accordion-header">
      {{ col.title }}
      <span class="tooltip-text">{{ col.tooltip }}</span>
    </button>

    <!-- Content -->
    <div class="accordion-content">
      {% for item in col.items %}
      <div class="accordion-item technique-item" data-value="{{ item.label }}" data-prefix="{{ col.id }}"> 
        {{ item.label }}
        <span class="tooltip-text-side">{{ item.tooltip }}</span>
      </div>
      {% endfor %}
    </div>

  </div>
  {% endfor %}
</div>

<!-- 4. UNIFIED SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function() {

  const container = document.getElementById('tech-accordion-container');
  if(!container) return;
  
  // --- CONFIGURATION ---
  const itemSelector = '.technique-item';
  const summaryOutput = document.getElementById('selected-list');
  const resetButton = document.getElementById('reset-techniques');
  const copyButton = document.getElementById('copy-techniques');
  const toggleAllBtn = document.getElementById('toggle-all-menus');
  
  const allContents = container.querySelectorAll('.accordion-content');
  const allHeaders = container.querySelectorAll('.accordion-header');
  const items = container.querySelectorAll(itemSelector);
  
  const vectorInput = document.getElementById('vector-input');
  const showVectorBtn = document.getElementById('show-vector-btn');
  const resetVectorBtn = document.getElementById('reset-vector-btn');
  const pasteVectorBtn = document.getElementById('paste-vector-btn');

  let allExpanded = false;

  // --- 1. ACCORDION INTERACTION ---
  allHeaders.forEach(header => {
    header.addEventListener('click', function() {
      this.classList.toggle('active');
      const panel = this.nextElementSibling;
      panel.classList.toggle('show');
      
      if (panel.classList.contains('show')) {
        panel.style.maxHeight = panel.scrollHeight + "px";
      } else {
        panel.style.maxHeight = null;
      }
    });
  });

  // --- 2. ITEM SELECTION ---
  items.forEach(item => {
    item.addEventListener('click', function(e) {
      this.classList.toggle('is-selected');
      updateSummaryDisplay();
    });
  });

  // --- 3. PASTE LOGIC ---
  if (pasteVectorBtn) {
    pasteVectorBtn.addEventListener('click', async function() {
      try {
        const text = await navigator.clipboard.readText();
        vectorInput.value = text;
      } catch (err) {
        console.error('Failed to read clipboard:', err);
        alert("Unable to access clipboard. Please check permissions.");
      }
    });
  }

  // --- 4. CLEAR/RESET LOGIC ---
  resetButton.addEventListener('click', function() {
    items.forEach(el => el.classList.remove('is-selected'));
    
    // Close all menus on reset
    allContents.forEach(content => {
      content.classList.remove('show');
      content.style.maxHeight = null;
    });

    allHeaders.forEach(header => header.classList.remove('active'));

    allExpanded = false;
    toggleAllBtn.textContent = "Expand All";

    updateSummaryDisplay();
  });

  // --- 5. COPY LOGIC ---
  copyButton.addEventListener('click', function() {
    const textToCopy = summaryOutput.textContent;
    if (textToCopy && textToCopy !== "None") {
      navigator.clipboard.writeText(textToCopy).then(() => {
        this.classList.add('copied');
        const icon = this.querySelector('i');
        icon.className = 'fas fa-check'; 
        setTimeout(() => {
          this.classList.remove('copied');
          icon.className = 'far fa-copy'; 
        }, 2000);
      });
    }
  });

  // --- 6. SHOW VECTOR (Parse Input) ---
  showVectorBtn.addEventListener('click', function() {
    const rawInput = vectorInput.value;
    if (!rawInput) return;

    // Clear current selection first
    items.forEach(el => el.classList.remove('is-selected'));

    const tokens = rawInput.split(',').map(t => t.trim());

    tokens.forEach(token => {
      const parts = token.split('.');
      if (parts.length === 2) {
        const prefix = parts[0]; 
        const label = parts[1];

        const targetItem = container.querySelector(`.technique-item[data-prefix="${prefix}"][data-value="${label}"]`);

        if (targetItem) {
          targetItem.classList.add('is-selected');

          // Auto-expand the parent accordion
          const parentContent = targetItem.closest('.accordion-content');
          const parentHeader = parentContent.previousElementSibling;

          if (parentContent) {
            parentContent.classList.add('show');
            parentContent.style.maxHeight = parentContent.scrollHeight + "px";
          }
          if (parentHeader) {
            parentHeader.classList.add('active');
          }
        }
      }
    });
    updateSummaryDisplay();
  });

  // --- 7. RESET INPUT ---
  resetVectorBtn.addEventListener('click', function() {
    vectorInput.value = "";
    resetButton.click(); // Triggers the main reset logic
  });

  // --- 8. TOGGLE ALL (Expand/Collapse) ---
  toggleAllBtn.addEventListener('click', function(e) {
    e.preventDefault();
    allExpanded = !allExpanded;
    
    if (allExpanded) {
      this.textContent = "Collapse All";
      allHeaders.forEach(h => h.classList.add('active'));
      allContents.forEach(c => {
        c.classList.add('show');
        c.style.maxHeight = c.scrollHeight + "px";
      });
    } else {
      this.textContent = "Expand All";
      allHeaders.forEach(h => h.classList.remove('active'));
      allContents.forEach(c => {
        c.classList.remove('show');
        c.style.maxHeight = null;
      });
    }
  });

  // --- HELPER: Update Display ---
  function updateSummaryDisplay() {
    const selectedItems = container.querySelectorAll(itemSelector + '.is-selected');
    
    const values = Array.from(selectedItems).map(el => {
      const prefix = el.getAttribute('data-prefix');
      const label = el.getAttribute('data-value').trim();
      return `${prefix}.${label}`; 
    });
    
    if (values.length > 0) {
      summaryOutput.textContent = values.join(', '); 
      resetButton.style.display = 'inline-block'; 
      copyButton.style.display = 'inline-block'; 
    } else {
      summaryOutput.textContent = "None";
      resetButton.style.display = 'none'; 
      copyButton.style.display = 'none'; 
    }
  }
});
</script>
