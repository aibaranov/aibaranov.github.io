# _data/tech_accordion_menu.yml
# Technique 1 (6 items: a, b, c, d, e, f)
- title: "Technique 1"
  id: "T1"
  tooltip: "Intercepting system services"
  items:
    - label: "a"
      tooltip: "Modifying SSDT (KiServiceTable)"
      description: "Intercepting system services by overwriting the System Service Dispatch Table."
    - label: "b"
      tooltip: "Modifying MSR_SYSENTER (IA32_SYSENTER_EIP, CS) for sysenter on x86"
      description: "Redirecting the system call entry point by altering Model-Specific Registers."
    - label: "c"
      tooltip: "Modifying KTHREAD.ServiceTable"
      description: "Intercepting system services for a specific thread by modifying its dedicated service table pointer."
    - label: "d"
      tooltip: "Modifying IDT[0x2E] system service interrupt"
      description: "Hijacking legacy system calls by overwriting the 0x2E vector within the Interrupt Descriptor Table."
    - label: "e"
      tooltip: "Inline patching of KiSystemService or KiFastCallEntry (x86)"
      description: "Intercepting control flow during system call dispatch by applying code patches to low-level dispatchers."
    - label: "f"
      tooltip: "Inline patching of Nt* functions from SSDT"
      description: "Hooking system services directly by overwriting the first bytes of specific native kernel APIs."


# Technique 2 (15 items: a, b, c, d, e, f, g, h, i, j, k, l, m, n, o)
- title: "Technique 2"
  id: "T2"
  tooltip: "Direct Kernel Object Manipulation (DKOM)"
  items:
    - label: "a"
      tooltip: "Unlinking  drivers from PsLoadedModulesList (LDR_DATA_TABLE_ENTRY)"
      description: "Hiding loaded kernel modules from system enumeration tools by removing them from the loaded module list."
    - label: "b"
      tooltip: "Unlinking processes from PsActiveProcessHead"
      description: "Hiding running processes from standard monitoring utilities by unlinking them from the active process list."
    - label: "c"
      tooltip: "Unlinking threads from KiWaitInListHead, KiWaitOutListHead, KiDispatcherReadyListHead"
      description: "Concealing threads from analysis tools by removing them from various thread scheduler lists."
    - label: "d"
      tooltip: "Modifying access token"
      description: "Elevating process privileges or altering security contexts by directly manipulating the kernel access token object."
    - label: "e"
      tooltip: "Removing objects from Ob object directory"
      description: "Hiding named resources from object manager lookups by deleting entries from the object directory structure."
    - label: "f"
      tooltip: "Removing driver objects from the list of driver objects"
      description: "Concealing a driver from system visibility by removing it from the Object Manager's Driver directory tracking list."
    - label: "g"
      tooltip: "Removing device objects from the list of device objects"
      description: "Removing device objects from the list of device objects."
    - label: "h"
      tooltip: "Forging ETHREAD fields"
      description: "Spoofing thread execution details and state metadata by directly overwriting fields in the ETHREAD object."
    - label: "i"
      tooltip: "Forging EPROCESS fields"
      description: "Spoofing process execution details and state metadata by directly overwriting fields in the EPROCESS object."
    - label: "j"
      tooltip: "Erasing items in PspCidTable"
      description: "Hiding active process and thread IDs from low-level lookup mechanisms by clearing their entries in the Client ID table."
    - label: "k"
      tooltip: "Erasing handles in the process handle table"
      description: "Hiding open resources and communication channels by wiping records from a process's internal handle table."
    - label: "l"
      tooltip: "Intercepting object type dispatch functions (procedures)"
      description: "Hijacking standard Object Manager actions on target objects by swapping function pointers in the object type initializer."
    - label: "m"
      tooltip: "Forging DRIVER_OBJECT fields"
      description: "Spoofing driver identity, sizes, or paths by directly overwriting items within the driver object structure."
    - label: "n"
      tooltip: "Hijacking or spoofing driver object"
      description: "Redirecting I/O requests meant for legitimate software by copying or changing critical drivers in kernel memory."
    - label: "o"
      tooltip: "Hijacking or spoofing device object"
      description: "Intercepting low-level device control paths by overlaying or impersonating target device nodes in the system tree."

# Technique 3 (9 items: a, b, c, d, e, f, g, h, i)
- title: "Technique 3"
  id: "T3"
  tooltip: "Inline patching kernel mode code (run-time patching, inline hooking, splicing)"
  items:
    - label: "a"
      tooltip: "Ntoskrnl - * Nt*, IofCallDriver, IofCompleteRequest, IoCreateFile, etc"
      description: "Subverting primary system APIs and I/O request paths by modifying code directly inside the core Windows kernel binary."
    - label: "b"
      tooltip: "FSD – Ntfs.sys, Fastfat.sys and attached filter, minifilter drivers (Filter Manager)"
      description: "Subverting storage operations by modifying execution paths inside file system drivers and their associated filter stacks."
    - label: "c"
      tooltip: "TCP/IP, NDIS - Tcpip.sys, Ndis.sys and its related internal structures"
      description: "Intercepting network traffic and hardware packet buffers by inline patching core networking drivers."
    - label: "d"
      tooltip: "IP Filter Driver - Ipfilterdriver.sys"
      description: "Manipulating firewall and packet routing decisions at runtime by injecting hooks into the legacy IP filter driver."
    - label: "e"
      tooltip: "SCSI Class System Dll classpnp.sys"
      description: "Intercepting storage command blocks by applying runtime patches to the storage class driver peripheral layer."
    - label: "f"
      tooltip: "Disk port drivers - atapi.sys, ataport.sys, storport.sys, scsiport.sys"
      description: "Manipulating raw disk sector reads and writes by intercepting operations inside low-level storage port drivers."
    - label: "g"
      tooltip: "NULL Driver - Null.sys"
      description: "Hiding diagnostic data or communications by inline patching the standard system bitbucket device driver."
    - label: "h"
      tooltip: "ACPI Driver for NT – acpi.sys"
      description: "Subverting low-level power management and configuration events by injecting code into the core ACPI driver."
    - label: "i"
      tooltip: "MS QoS Packet Scheduler - psched.sys"
      description: "Manipulating network bandwidth allocation and packet scheduling behavior via inline hooks in the QoS module."

# Technique 4 (10 items: a, b, c, d, e, f, g, h, i, j)
- title: "Technique 4"
  id: "T4"
  tooltip: "Intercepting driver object major functions or DriverUnload"
  items:
    - label: "a"
      tooltip: "FSD – Fastfat.sys, Ntfs.sys to hide files"
      description: "Hiding specific directories and files on disk by replacing I/O request handlers within the file system drivers."
    - label: "b"
      tooltip: "TDI Tcpip.sys, Ndis.sys, also NDIS_OPEN_BLOCK and NDIS_PROTOCOL_BLOCK handlers"
      description: "Intercepting raw connections and data streams by rewriting operational callbacks in network architecture layers."
    - label: "c"
      tooltip: "Disk port/miniport drivers - atapi.sys, ataport.sys, storport.sys, scsiport.sys"
      description: "Manipulating raw data reads and blocks by overriding major function pointers in storage hardware port drivers."
    - label: "d"
      tooltip: "Fast I/O Dispatch Routine (FastIoDeviceControl) AfdFastIoDeviceControl of Afd.sys"
      description: "Intercepting rapid socket communication operations by hijacking fast I/O control pathways within the Ancillary Function Driver."
    - label: "e"
      tooltip: "Network Store Interface (NSI) driver nsiproxy.sys to hide TCP ports"
      description: "Concealing malicious network connections from netstat utilities by substituting major functions in the NSI proxy driver."
    - label: "f"
      tooltip: "NULL Driver - Null.sys to hide rootkit activity"
      description: "Diverting diagnostic telemetry or logging routines by overriding dispatch pointers within the system NULL driver."
    - label: "g"
      tooltip: "LiveKd debugger driver"
      description: "Evading live system analysis and memory forensics by altering the major dispatch vectors of the LiveKd utility driver."
    - label: "h"
      tooltip: "FS Filter Manager fltmgr.sys"
      description: "Neutralizing file monitor software globally by intercepting control commands inside the main File System Filter Manager."
    - label: "i"
      tooltip: "Disk driver disk.sys"
      description: "Intercepting structural I/O control requests sent to block storage devices by hijacking the standard disk class driver."
    - label: "j"
      tooltip: "SCSI CD-ROM driver cdrom.sys"
      description: "Monitoring or manipulating optical media access routines by replacing major function arrays in the CD-ROM driver."

