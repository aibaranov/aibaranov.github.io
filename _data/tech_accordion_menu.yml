      description: "Evading OS-level network monitoring by bypassing the Windows IP stack entirely using a standalone, custom network engine."
    - label: "m"
      tooltip: "Disables or bypasses PatchGuard"
      description: "Disabling Kernel Patch Protection (KPP)."
    - label: "n"
      tooltip: "Files signed by a stolen cert (x86) (for x64 refer to [T14.c])"
      description: "Bypassing Windows kernel checks on x86 systems by signing malware with compromised, valid certificates."
      
# Technique 13 (5 items: a, b, c, d, e)
