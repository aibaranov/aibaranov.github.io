# Technique 12 (14 items: a, b, c, d, e, f, g, h, i, j, k, l, m, n)
- title: "Technique 12"
  id: "T12"
  tooltip: "Other tricks"
  items:
    - label: "a"
      tooltip: "ObMakeTemporaryObject to remove the driver object’s name"
      description: "Evading namespace enumeration by stripping away a driver object's permanent status and name from the Object Manager."
    - label: "b"
      tooltip: "Disabling WFP callout drivers (via netio!gwfpGlobal)"
      description: "Bypassing local firewalls by modifying the global Windows Filtering Platform state variable in memory."
    - label: "c"
      tooltip: "Disabling Event Tracing (ETW) (via nt!EtwpHostSiloState)"
      description: "Suppressing security log generation by changing the host silo state structures tracking active ETW engines."
    - label: "d"
      tooltip: "Disabling System Loggers (via nt!EtwpActiveSystemLoggers)"
      description: "Stopping kernel event logging operations by zeroing or modifying flags within the active system loggers bitmask."
    - label: "e"
      tooltip: "Disabling FS minifilter drivers (via unlinking the appropriate structures)"
      description: "Neutralizing endpoint detection agents by severing file system minifilter objects from the Filter Manager's tracking chains."
    - label: "f"
      tooltip: "Disabling Image Verification Callbacks"
      description: "Allowing unsigned code execution by neutralizing kernel routines that validate files before execution."
    - label: "g"
      tooltip: "Hidden (Encrypted) File System (VFS)"
      description: "Concealing tools and configuration data by implementing a custom, encrypted virtual file system within raw disk sectors."
    - label: "h"
      tooltip: "Hiding services by unlinking the corresponding SERVICE_RECORD structure"
      description: "Concealing malicious persistence services by pulling their tracking records out of the Service Control Manager's memory list."
    - label: "i"
      tooltip: "Preventing writing kernel memory dumps by registering its callback with KeRegisterBugCheckReasonCallback"
      description: "Hiding evidence of kernel corruption during blue-screen crashes by wiping data via a custom bugcheck callback routine."
    - label: "j"
      tooltip: "Replacing HHIVE.GetCellRoutine pointer to get control over system registry operations"
      description: "Hijacking registry read/write operations by modifying internal cell lookup pointers inside target registry hives."
    - label: "k"
