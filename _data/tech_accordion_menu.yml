# Technique 14 (6 items: a, b, c, d, e, f)
- title: "Technique 14"
  id: "T14"
  tooltip: "Defeating DSE (for x64 only)"
  items:
    - label: "a"
      tooltip: "BYOVD to (covertly) load the driver or patch the Windows kernel, DSE variables (g_CiEnabled)"
      description: "Bypassing Driver Signature Enforcement by utilizing a vulnerable legitimate driver to toggle policy variables in kernel memory."
    - label: "b"
      tooltip: "Signing the driver by a self-signed cert + reboot with TESTSIGNING bootloader flag"
      description: "Bypassing driver validation by enabling the system test configuration flag and utilizing custom signatures."
    - label: "c"
      tooltip: "The driver has a valid digital signature (signed by a stolen cert)"
      description: "Satisfying x64 kernel validation demands natively by executing drivers signed with stolen valid certificates."
    - label: "d"
      tooltip: "Exploitation of a Windows kernel vulnerability"
      description: "Defeating driver validation security policies by exploiting zero-day or unpatched flaws within the operating system kernel."
    - label: "e"
      tooltip: "The bootkit loads the driver manually"
      description: "Bypassing signature validation checks by resolving dependencies and loading raw driver files into memory manually prior to OS startup."
    - label: "f"
      tooltip: "The bootkit patches the Windows kernel"
      description: "Bypassing signature validation checks by applying runtime patches to core operating system binaries during the boot phase."
